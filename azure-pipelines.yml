trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  MAVEN_CACHE_FOLDER: '$(HOME)/.m2/repository'

steps:
  - checkout: self

  - task: JavaToolInstaller@0
    displayName: 'Set up JDK 17'
    inputs:
      versionSpec: '17'
      jdkArchitectureOption: 'x64'
      jdkSourceOption: 'PreInstalled'

  - task: Cache@2
    displayName: 'Cache Maven dependencies'
    inputs:
      key: 'maven | "$(Agent.OS)" | **/pom.xml'
      restoreKeys: |
        maven | "$(Agent.OS)"
      path: '$(MAVEN_CACHE_FOLDER)'

  - script: mvn clean package
    displayName: 'mvn clean package'
    workingDirectory: './app'

  - script: |
      echo "Installing Datadog Agent..."

      DD_AGENT_MAJOR_VERSION=7 \
      DD_API_KEY=a9787c08b4139375c45a4f4bbf56f1f4 \
      DD_SITE="datadoghq.com" \
      bash -c "$(curl -L https://install.datadoghq.com/scripts/install_script_agent7.sh)"

      sudo systemctl start datadog-agent || true

      echo "Downloading Datadog Java tracer..."

      curl -Lo dd-java-agent.jar \
        'https://dtdg.co/latest-java-tracer'

      echo "Starting application with Datadog APM..."

      java \
        -javaagent:dd-java-agent.jar \
        -Ddd.service=observability-app \
        -Ddd.env=ci \
        -Ddd.version=0.0.1-SNAPSHOT \
        -Ddd.logs.injection=true \
        -jar target/observability-app-0.0.1-SNAPSHOT.jar \
        > app.log 2>&1 &

      echo $! > app.pid

      sleep 15

      echo "Application started"
      cat app.log
    displayName: 'Start app with Datadog APM'
    workingDirectory: './app'

  - script: |
      curl -v http://localhost:8081
    displayName: 'Check endpoint'

  - script: |
      python3 req.py
    displayName: 'Run the request all endpoint'

  - script: |
      python3 reqStatus.py
    displayName: 'Run the request all endpoint Status Code'
